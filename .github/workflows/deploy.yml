name: Deploy to Server

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalace závislostí
        run: pip install -r requirements-dev.txt
      - name: Testy
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.APP_DIR }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}

    steps:
      - name: Checkout (metadata only)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify SSH connectivity (optional)
        run: |
          echo "Testing SSH to ${{ secrets.SSH_HOST }} as ${{ secrets.SSH_USER }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: APP_DIR,SERVICE_NAME
          script: |
            set -e
            echo "===================="
            echo "Deploy skript startuje"
            echo "APP_DIR=$APP_DIR"
            echo "SERVICE_NAME=$SERVICE_NAME"
            echo "Aktuální uživatel: $(whoami)"
            echo "Aktuální hostname: $(hostname)"
            echo "Datum a čas: $(date)"
            echo "===================="
            
            echo "[0/8] Připravuji SSH known_hosts pro GitHub…"
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            # Přidá GitHub host key (vyhne se interaktivnímu promptu)
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            echo "[1/8] Přecházím do adresáře: $APP_DIR"
            cd "$APP_DIR"

            echo "[2/8] Fetch z origin..."
            git fetch --all

            echo "[3/8] Reset na origin/main..."
            git reset --hard origin/main

            echo "[4/8] Zobrazuji aktuální commit:"
            git rev-parse --short HEAD

            echo "[5/8] Aktivace virtuálního prostředí..."
            if [ ! -d ".venv" ]; then
              echo "  Venv neexistuje – vytvářím..."
              python3 -m venv .venv
            else
              echo "  Venv už existuje."
            fi
            . .venv/bin/activate

            echo "[6/8] Instalace/aktualizace závislostí..."
            python -m pip install -U pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            else
              echo "  Soubor requirements.txt nenalezen."
            fi

            echo "[7/8] Migrace databáze (alembic upgrade head)..."
            alembic upgrade head
            python app/manage.py recalculate-consumption

            echo "[8/8] Restart služby: $SERVICE_NAME"
            sudo /usr/bin/systemctl restart "$SERVICE_NAME"
            sudo /usr/bin/systemctl --no-pager --full status "$SERVICE_NAME" || true

            echo "Deploy dokončen!"