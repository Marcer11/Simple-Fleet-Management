# Konfigurace Alembic migrací databáze.
# URL databáze se bere z .env (viz app/services/config.py), ne z tohoto souboru.
#
#   alembic upgrade head      # aktualizuje DB na nejnovější schéma
#   alembic current           # zobrazí aktuální verzi DB

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s/app
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
